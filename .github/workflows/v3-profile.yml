name: v3 Unity profile parity
on: [push, pull_request]
concurrency:
  group: v3-profile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {submodules: recursive}
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '10.0.x'}
      - run: bash eng/gate-v3.sh dotnet
      - uses: actions/upload-artifact@v4
        with: {name: profile-parity-and-local-packages, path: artifacts}
  native-unity:
    name: Unity Mono + EditMode + PlayMode
    runs-on: [self-hosted, unity]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: parity
    steps:
      - uses: actions/checkout@v4
        with: {submodules: recursive}
      - name: Newest Unity 7 editor, installed by name when missing
        run: |
          command -v unity >/dev/null || [ -x ~/.local/bin/unity ] || curl -fsSL https://unity.com/install.sh | bash
          python3 eng/unity_editor.py editor
      - run: bash eng/gate-v3.sh unity
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: native-unity-reports, path: artifacts}
